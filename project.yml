# Source of truth for the Xcode project. Run `make app` to regenerate NookApp.xcodeproj.
name: NookApp
options:
  bundleIdPrefix: com.mchau
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"

globalSettings:
  base:
    SWIFT_VERSION: "6.0"

schemes:
  NookApp:
    build:
      targets:
        NookApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NookAppTests

targets:
  NookApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/NookApp
      - path: NookApp
    info:
      path: NookApp/Info.plist
      properties:
        CFBundleName: Nook
        CFBundleIdentifier: com.mchau.nook
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSMainNibFile: ""
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_NAME: Nook
        PRODUCT_BUNDLE_IDENTIFIER: com.mchau.nook
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    entitlements:
      path: NookApp/NookApp.entitlements
      properties:
        com.apple.security.app-sandbox: false
    postBuildScripts:
      - name: Embed NookDaemon
        script: |
          set -e
          NOOK_PKG="${SRCROOT}"
          swift build --package-path "${NOOK_PKG}" -c release
          DAEMON_BIN="$(swift build --package-path "${NOOK_PKG}" -c release --show-bin-path)/NookDaemon"
          DEST="${BUILT_PRODUCTS_DIR}/${EXECUTABLE_FOLDER_PATH}/NookDaemon"
          cp "${DAEMON_BIN}" "${DEST}"
          chmod +x "${DEST}"
      - name: Copy Local Maygetsu Assets
        script: |
          SRC="${SRCROOT}/NookApp/GeneratedAssets.local/Maygetsu"
          DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/Maygetsu"
          if [ -f "${SRC}/maygetsu-manifest.json" ]; then
            rm -rf "${DST}"
            cp -R "${SRC}" "${DST}"
            echo "Copied local Maygetsu assets into bundle."
          else
            echo "No local Maygetsu assets found — skipping copy."
          fi
      - name: Copy Tiled Map
        script: |
          SRC="${SRCROOT}/tiled"
          DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/tiled"
          if [ -f "${SRC}/nook-village.tmj" ]; then
            rm -rf "${DST}"
            cp -R "${SRC}" "${DST}"
            PACK="${SRCROOT}/Assets.local/Maygetsu/source/CozyTown_AssetPack"
            for TSJ in "${DST}/tilesets/"*.tsj; do
              sed -i '' "s|../../Assets.local/Maygetsu/source/CozyTown_AssetPack|${PACK}|g" "${TSJ}"
            done
            echo "Copied and patched Tiled map into bundle."
          else
            echo "No Tiled map found — skipping copy."
          fi
  NookAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/NookAppTests
    dependencies:
      - target: NookApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mchau.nook.tests
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nook.app/Contents/MacOS/Nook"
        BUNDLE_LOADER: "$(TEST_HOST)"
